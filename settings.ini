[Network]
; Wireless / Hotspot IP of your Nothing Phone (e.g., 10.38.115.80 or 192.168.43.1)
WirelessIp=10.38.115.80

; Optional Wi-Fi Hotspot SSID for auto-connecting Wi-Fi if configured
HotspotSsid=Nothing phone (2a) Plus

[Display]
; Resolution for secondary Virtual Display
VirtualResolution=1920x1080

; Framerate for local Hotspot / USB (120 or 60)
MaxFps=120

; Video codec: h265 or h264
VideoCodec=h265

[Security]
; Lock screen type: pattern, pin, password, or none
LockType=pattern

; If LockType=pin or LockType=password, enter your unlock PIN or password:
LockCode=

; If LockType=pattern, enter your 3x3 pattern sequence (digits 1 to 9):
; 1 2 3
; 4 5 6
; 7 8 9
Pattern=159873
